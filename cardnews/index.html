<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 카드뉴스 넘겨 보기 페이지: 인스타그램처럼 옆으로 넘기며 보고, 한 장씩 저장할 수 있습니다 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>카드뉴스 | 우리 가게 홈페이지 제작</title>
<meta name="description" content="자영업자·사업자를 위한 홈페이지 제작 카드뉴스 5장과 대표 배너." />
<meta name="theme-color" content="#1f6bff" />
<meta property="og:title" content="우리 가게 홈페이지 제작 카드뉴스" />
<meta property="og:image" content="https://okaissem.github.io/cardnews/01-cover.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B1%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --navy: #0b1f4d; --soft: #4a5878; --blue: #1f6bff; --blue-deep: #1747c9; --sky: #e8f1ff; --white: #fff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; color: var(--navy); word-break: keep-all;
    background: linear-gradient(180deg, #f5f9ff, var(--sky) 60%, #f5f9ff);
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .top h1 { font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 26px; margin: 0; }
  .top h1 span { color: var(--blue); }
  .home { font-weight: 900; font-size: 14px; color: var(--blue); text-decoration: none; background: var(--white); border-radius: 999px; padding: 8px 14px; box-shadow: 0 6px 16px rgba(11, 31, 77, 0.1); white-space: nowrap; }

  /* 넘기는 칸 */
  .viewer { position: relative; }
  .slides {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth;
    border-radius: 22px; box-shadow: 0 20px 44px rgba(11, 31, 77, 0.18); background: var(--white);
    scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slides figure { flex: 0 0 100%; margin: 0; scroll-snap-align: center; scroll-snap-stop: always; }
  .slides img { display: block; width: 100%; height: auto; aspect-ratio: 1080 / 1350; object-fit: cover; }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border-radius: 50%; border: 0;
    background: rgba(255, 255, 255, 0.92); color: var(--blue); font-size: 24px; font-weight: 900; cursor: pointer;
    box-shadow: 0 8px 20px rgba(11, 31, 77, 0.2); display: grid; place-items: center;
  }
  .arrow:disabled { opacity: 0; pointer-events: none; }
  .prev { left: 10px; } .next { right: 10px; }
  /* 장 번호는 카드 그림에 이미 있어서, 화면 읽기 프로그램용으로만 둡니다 */
  .count { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .dots { display: flex; justify-content: center; gap: 8px; margin: 16px 0 6px; }
  .dots button { width: 9px; height: 9px; border-radius: 999px; border: 0; padding: 0; background: #b8c9ea; cursor: pointer; transition: 0.25s; }
  .dots button[aria-current="true"] { width: 26px; background: var(--blue); }
  .hint { text-align: center; color: var(--soft); font-size: 14px; margin: 0; }

  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { flex: 1; text-align: center; text-decoration: none; font-weight: 900; font-size: 16px; padding: 14px; border-radius: 16px; }
  .btn-blue { background: linear-gradient(135deg, var(--blue-deep), var(--blue)); color: #fff; box-shadow: 0 10px 22px rgba(23, 71, 201, 0.28); }
  .btn-white { background: var(--white); color: var(--blue); box-shadow: 0 8px 18px rgba(11, 31, 77, 0.1); }

  h2 { font-size: 18px; margin: 36px 0 12px; }
  .banner { display: block; border-radius: 18px; overflow: hidden; box-shadow: 0 14px 30px rgba(11, 31, 77, 0.15); }
  .banner img { display: block; width: 100%; height: auto; }
  .note { color: var(--soft); font-size: 14px; line-height: 1.7; margin: 12px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>카드뉴스 <span>5장</span></h1>
    <a class="home" href="../">홈페이지 보기 →</a>
  </div>

  <div class="viewer">
    <div class="slides" id="slides" tabindex="0" aria-label="카드뉴스, 옆으로 넘겨 보세요">
      <figure><img src="01-cover.png" alt="1장: 사장님 가게, 홈페이지 있으세요?" width="1080" height="1350" /></figure>
      <figure><img src="02-design.png" alt="2장: 업종에 맞춘 디자인" width="1080" height="1350" loading="lazy" /></figure>
      <figure><img src="03-dm-order.png" alt="3장: 누르면 주문서, DM으로 바로" width="1080" height="1350" loading="lazy" /></figure>
      <figure><img src="04-youtube.png" alt="4장: 유튜브 손님도 주문으로 연결" width="1080" height="1350" loading="lazy" /></figure>
      <figure><img src="05-price.png" alt="5장: 제작 가격" width="1080" height="1350" loading="lazy" /></figure>
    </div>
    <button class="arrow prev" id="prev" type="button" aria-label="이전 장">‹</button>
    <button class="arrow next" id="next" type="button" aria-label="다음 장">›</button>
    <span class="count" id="count" aria-live="polite">1 / 5</span>
  </div>
  <div class="dots" id="dots"></div>
  <p class="hint">옆으로 밀거나 화살표를 눌러 넘겨 보세요</p>

  <div class="actions">
    <a class="btn btn-blue" id="save" href="01-cover.png" download>이 장 저장하기</a>
    <a class="btn btn-white" href="../">홈페이지 보기</a>
  </div>

  <h2>대표 배너</h2>
  <a class="banner" href="00-banner.png" download><img src="00-banner.png" alt="자영업자·사업자를 위한 우리 가게 홈페이지 제작 배너" width="1448" height="1086" loading="lazy" /></a>
  <p class="note">※ 휴대폰에서 저장이 안 되면 사진을 꾹 눌러 "이미지 저장"을 선택하세요.<br />인스타그램에는 1장부터 5장까지 순서대로 올리시면 됩니다.</p>
</div>

<script>
  (function () {
    "use strict";
    var slides = document.getElementById("slides");
    var figures = slides.querySelectorAll("figure");
    var total = figures.length;
    var prev = document.getElementById("prev");
    var next = document.getElementById("next");
    var count = document.getElementById("count");
    var save = document.getElementById("save");
    var dotsBox = document.getElementById("dots");
    var current = 0;

    var dots = Array.prototype.map.call(figures, function (_, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", (i + 1) + "장으로");
      b.addEventListener("click", function () { go(i); });
      dotsBox.appendChild(b);
      return b;
    });

    function go(i) {
      i = Math.max(0, Math.min(total - 1, i));
      slides.scrollTo({ left: i * slides.clientWidth });
    }

    function update() {
      var i = Math.round(slides.scrollLeft / slides.clientWidth);
      current = Math.max(0, Math.min(total - 1, i));
      count.textContent = (current + 1) + " / " + total;
      prev.disabled = current === 0;
      next.disabled = current === total - 1;
      dots.forEach(function (d, k) { d.setAttribute("aria-current", k === current ? "true" : "false"); });
      save.href = figures[current].querySelector("img").getAttribute("src");
    }

    prev.addEventListener("click", function () { go(current - 1); });
    next.addEventListener("click", function () { go(current + 1); });
    slides.addEventListener("scroll", function () { window.requestAnimationFrame(update); }, { passive: true });
    slides.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") { e.preventDefault(); go(current + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(current - 1); }
    });
    window.addEventListener("resize", function () { go(current); });
    update();
  })();
</script>
</body>
</html>
