<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 결제가 끝난 뒤 돌아오는 화면 (성공 · 실패) -->
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>주문 결과</title>
<meta name="theme-color" content="#121212" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8D%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=20260929a" />
<style>
  body { padding-bottom: 0; }
  .result { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  .result .mark { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 900; background: var(--accent); color: var(--accent-ink); }
  .result.fail .mark { background: var(--surface-2); color: var(--sale); }
  .result h1 { font-size: 28px; margin-top: 18px; }
  .result .lead { color: var(--ink-soft); margin: 8px 0 0; }
  .box { margin-top: 24px; padding: 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
  .box h2 { font-size: 16px; margin-bottom: 10px; }
  .kv div { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 7px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
  .kv div:last-child { border-bottom: 0; }
  .kv dt { color: var(--ink-soft); }
  .kv dd { margin: 0; word-break: break-all; }
  .kv.lines div { grid-template-columns: 1fr auto; }
  .kv.lines dt { color: var(--ink); }
  .kv.lines dd { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kv.lines div:last-child dd { color: var(--accent); font-weight: 800; }
  .actions { display: grid; gap: 8px; margin-top: 24px; }
  .actions a { text-align: center; }
  .kakao-btn { background: var(--kakao); color: var(--kakao-text); }
  .note { margin-top: 16px; font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>

<header class="site-header" style="grid-template-columns: 1fr auto">
  <a class="logo" href="./" id="logo">SHOP</a>
</header>

<main class="result" id="result" aria-live="polite"></main>

<script src="config.js?v=20260929a"></script>
<script>
(function () {
  "use strict";
  var config = window.SHOP_CONFIG || {};
  var ps = new URLSearchParams(location.search);
  var root = document.getElementById("result");
  document.getElementById("logo").textContent = config.storeName || "SHOP";

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function won(n) { return Number(n).toLocaleString("ko-KR") + "원"; }
  function kv(rows) {
    var dl = el("dl", "kv");
    rows.forEach(function (r) {
      if (r[1] == null || r[1] === "") return;
      var d = el("div");
      d.appendChild(el("dt", "", r[0]));
      d.appendChild(el("dd", "", r[1]));
      dl.appendChild(d);
    });
    return dl;
  }
  function load(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } }
  function actions() {
    var a = el("div", "actions");
    var back = el("a", "btn btn-accent wide", "계속 쇼핑하기");
    back.href = "./";
    var k = el("a", "btn wide kakao-btn", "카카오톡으로 문의하기");
    var url = (config.links || {}).kakao;
    k.href = url && url !== "#demo" ? url : "#";
    k.target = "_blank";
    k.rel = "noopener";
    if (!url || url === "#demo") k.addEventListener("click", function (e) { e.preventDefault(); alert("시안용 가상 링크입니다. 실제 카카오톡 채널 주소를 받으면 연결됩니다."); });
    a.appendChild(back);
    a.appendChild(k);
    return a;
  }
  function showFail(msg) {
    root.className = "result fail";
    root.innerHTML = "";
    root.appendChild(el("div", "mark", "!"));
    root.appendChild(el("h1", "", "결제를 마치지 못했습니다"));
    root.appendChild(el("p", "lead", msg || "결제가 취소되었거나 중간에 멈췄습니다. 돈은 빠져나가지 않았습니다."));
    var code = ps.get("code");
    if (code) root.appendChild(el("p", "note", "오류 코드: " + code));
    root.appendChild(actions());
  }
  function showDone(order, paymentKey, check) {
    root.className = "result";
    root.innerHTML = "";
    root.appendChild(el("div", "mark", "✓"));
    root.appendChild(el("h1", "", "주문이 완료되었습니다"));
    root.appendChild(el("p", "lead", "결제가 확인되면 1~3일 안에 보내 드리고, 송장 번호는 문자로 알려 드립니다."));

    var items = el("div", "box");
    items.appendChild(el("h2", "", "주문 상품"));
    var list = kv(order.items.map(function (it) {
      var opt = [it.color, it.size].filter(Boolean).join(" / ");
      return [it.n + (opt ? " (" + opt + ")" : "") + " × " + it.qty, won(it.price * it.qty)];
    }).concat([["배송비", order.fee ? won(order.fee) : "무료"], ["결제 금액", won(order.amount)]]));
    list.classList.add("lines");
    items.appendChild(list);
    root.appendChild(items);

    var c = order.customer || {};
    var info = el("div", "box");
    info.appendChild(el("h2", "", "받는 분"));
    info.appendChild(kv([["주문번호", order.orderId], ["성함", c.name], ["휴대폰", c.phone], ["주소", c.addr], ["요청 사항", c.memo]]));
    root.appendChild(info);

    root.appendChild(actions());
    if (check) root.appendChild(el("p", "note", check));
  }

  // ---------- 결제 실패 ----------
  if (ps.get("fail")) {
    showFail(ps.get("message"));
    return;
  }

  // ---------- 결제 성공: 저장해 둔 주문과 금액이 같은지 확인 ----------
  var order = load("shop-last-order");
  var orderId = ps.get("orderId");
  var amount = Number(ps.get("amount"));
  var paymentKey = ps.get("paymentKey");
  if (!order || !orderId || order.orderId !== orderId || order.amount !== amount) {
    showFail("주문 정보를 찾을 수 없거나 결제 금액이 주문과 다릅니다. 카카오톡으로 주문번호를 알려 주시면 확인해 드립니다.");
    return;
  }

  function finish(note) {
    // 장바구니에서 결제했으면 장바구니를 비웁니다
    if (order.source === "cart") { try { localStorage.removeItem("shop-cart"); } catch (e) {} }
    showDone(order, paymentKey, note);
  }

  var confirmUrl = (config.pay || {}).confirmUrl;
  if (confirmUrl) {
    // 실제 운영: 결제 승인 서버에 금액을 다시 확인받고 승인합니다 (시크릿 키는 서버에만 둡니다)
    root.appendChild(el("p", "lead", "결제를 확인하고 있습니다…"));
    fetch(confirmUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ paymentKey: paymentKey, orderId: orderId, amount: amount, order: order }),
    }).then(function (res) {
      if (!res.ok) throw new Error("confirm failed");
      finish("");
    }).catch(function () {
      showFail("결제 확인 중 문제가 생겼습니다. 돈이 빠져나갔다면 자동으로 취소되며, 카카오톡으로 주문번호(" + orderId + ")를 알려 주세요.");
    });
    return;
  }
  finish(config.previewMode ? "※ 시안입니다. 테스트 결제라 실제로 돈이 나가지 않았습니다. 실제 운영에서는 이 화면에서 결제 승인 서버를 거칩니다." : "");
})();
</script>
</body>
</html>
