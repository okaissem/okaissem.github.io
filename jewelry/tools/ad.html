<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/600.css">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0b0908; }
  #stage { position: relative; width: 1280px; height: 720px; }
  canvas { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.65) 100%); }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; }
  .txt { position: absolute; left: 0; right: 0; text-align: center; color: #f5efe4; opacity: 0;
    font-family: "Noto Serif KR", serif; font-weight: 600; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
  .big { font-size: 64px; letter-spacing: 0.02em; }
  .mid { font-size: 40px; }
  .kick { font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 26px; letter-spacing: 0.5em; color: #d4b06a; }
  .logo { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 92px; letter-spacing: 0.06em;
    background: linear-gradient(135deg, #f3dca2, #d4b06a 45%, #a9853f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .small { font-family: "Noto Serif KR", serif; font-weight: 400; font-size: 26px; color: #bfb5a6; }
  .mark { position: absolute; right: 22px; bottom: 16px; font: 400 15px "Noto Serif KR", serif; color: rgba(245,239,228,.45); }
  .glint { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; opacity: 0; mix-blend-mode: screen;
    background:
      radial-gradient(circle, rgba(255,255,255,1) 0 3%, rgba(255,255,255,.5) 6%, transparent 18%),
      linear-gradient(90deg, transparent 0 46%, rgba(255,255,255,.95) 50%, transparent 54% 100%),
      linear-gradient(0deg, transparent 0 47%, rgba(255,255,255,.9) 50%, transparent 53% 100%);
    -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); }
  .line { position: absolute; left: 50%; height: 1px; background: linear-gradient(90deg, transparent, #d4b06a, transparent); transform: translateX(-50%); opacity: 0; }
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<div id="stage">
  <div class="vignette"></div>
  <div class="txt big" id="t1" style="top:250px; left:120px; text-align:left">당신의 하루에</div>
  <div class="txt big" id="t2" style="top:340px; left:120px; text-align:left">작은 빛 하나</div>
  <div class="txt kick" id="t3" style="top:64px">HANDPICKED JEWELRY</div>
  <div class="txt mid" id="t4" style="top:560px">매일 착용해도 편안한</div>
  <div class="txt mid" id="t5" style="top:600px">반지 · 목걸이 · 귀걸이 · 팔찌</div>
  <div class="txt logo" id="t6" style="top:430px">Finest Jewelry</div>
  <div class="line" id="ln" style="top:555px; width:420px"></div>
  <div class="txt small" id="t7" style="top:575px">네이버 스마트스토어에서 만나보세요</div>
  <div id="glints"></div>
  <div class="fade" id="fade"></div>
  <div class="mark">시안용 가상 광고</div>
</div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x0b0908, 1);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.getElementById("stage").prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.02).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(28, W / H, 0.05, 100);

// 어두운 바닥 (살짝 광택)
const floor = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshPhysicalMaterial({ color: 0x120e0b, roughness: 0.45, metalness: 0, envMapIntensity: 0.06 }));
scene.fog = new THREE.Fog(0x0b0908, 9, 22);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.SpotLight(0xffe2b0, 60, 20, 0.5, 0.7, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 8;
scene.add(key, key.target);
const rim = new THREE.PointLight(0xffd79a, 8, 12);
scene.add(rim);

// ---------- 재질 ----------
const gold = new THREE.MeshPhysicalMaterial({ color: 0xffc86e, metalness: 1, roughness: 0.1, clearcoat: 0.6, clearcoatRoughness: 0.05 });
const rose = new THREE.MeshPhysicalMaterial({ color: 0xf2b09a, metalness: 1, roughness: 0.12, clearcoat: 0.6 });
const gemMat = (c) => new THREE.MeshPhysicalMaterial({ color: new THREE.Color(c), metalness: 0, roughness: 0, transmission: 1, thickness: 0.6, ior: 2.4, dispersion: 4, envMapIntensity: 3, flatShading: true });
const pearlMat = new THREE.MeshPhysicalMaterial({ color: 0xeadcc4, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08, iridescence: 1, iridescenceIOR: 1.6, sheen: 1, sheenColor: 0xffeef4 });

function brilliant(s, mat) {
  const p = [[0.0001, -0.42], [0.36, -0.02], [0.4, 0], [0.4, 0.04], [0.24, 0.2], [0.0001, 0.2]].map(([x, y]) => new THREE.Vector2(x * s, y * s));
  return new THREE.Mesh(new THREE.LatheGeometry(p, 16), mat);
}
function setting(metal, r = 0.33, h = 0.46, y = 0) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + (i * Math.PI) / 2;
    const prong = new THREE.Mesh(new THREE.CylinderGeometry(0.035 * r / 0.33, 0.045 * r / 0.33, h, 12), metal);
    prong.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    prong.rotation.z = -Math.cos(a) * 0.25;
    prong.rotation.x = Math.sin(a) * 0.25;
    g.add(prong);
  }
  const basket = new THREE.Mesh(new THREE.TorusGeometry(r * 0.85, 0.035 * r / 0.33, 12, 48), metal);
  basket.rotation.x = Math.PI / 2;
  basket.position.y = y - h * 0.5;
  g.add(basket);
  return g;
}
function chain(curve, metal, linkLen, thick) {
  const n = Math.floor(curve.getLength() / (linkLen * 0.75));
  const geo = new THREE.TorusGeometry(linkLen * 0.5, thick, 8, 20);
  geo.scale(1.35, 0.75, 1);
  const mesh = new THREE.InstancedMesh(geo, metal, n);
  const m = new THREE.Matrix4(), q1 = new THREE.Quaternion(), q2 = new THREE.Quaternion(), X = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i < n; i++) {
    const t = i / n, pos = curve.getPointAt(t), tan = curve.getTangentAt(t);
    q1.setFromUnitVectors(X, tan);
    q2.setFromAxisAngle(tan, i % 2 ? Math.PI / 2 : 0);
    m.compose(pos, q2.multiply(q1), new THREE.Vector3(1, 1, 1));
    mesh.setMatrixAt(i, m);
  }
  return mesh;
}
function necklaceCurve() {
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const a = Math.PI * (0.05 + 0.9 * (i / 60));
    pts.push(new THREE.Vector3(-Math.cos(a) * 1.9, 0.03, Math.sin(a) * 1.7 - 1.25));
  }
  return new THREE.CatmullRomCurve3(pts);
}
function shadows(g) { g.traverse((o) => { if (o.isMesh) o.castShadow = true; }); return g; }

// ---------- 소품 ----------
const P = {};
P.ring = (() => {
  const r = new THREE.Group();
  const band = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 64, 256), gold);
  band.scale.set(1, 1, 1.9);
  // 어두운 배경에서도 반짝이도록 반사를 섞은 다이아몬드
  const dm = gemMat("#ffffff");
  dm.transmission = 0.45;
  dm.metalness = 0.25;
  dm.envMapIntensity = 5;
  dm.clearcoat = 1;
  dm.iridescence = 0.5;
  const gem = brilliant(1, dm);
  gem.position.y = 1.5;
  r.add(band, gem, setting(gold, 0.33, 0.46, 1.36));
  r.position.y = 1.1;
  r.userData.gem = gem;
  return shadows(r);
})();
P.pearl = (() => {
  const g = new THREE.Group();
  const c = necklaceCurve();
  g.add(chain(c, gold, 0.075, 0.012));
  const b = c.getPointAt(0.5);
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.3, 64, 48), pearlMat);
  pearl.position.set(b.x, 0.3, b.z + 0.45);
  g.add(pearl);
  g.userData.focus = pearl.position.clone();
  return shadows(g);
})();
P.heart = (() => {
  const s = new THREE.Shape();
  s.moveTo(0, -0.35);
  s.bezierCurveTo(-0.05, -0.25, -0.42, -0.05, -0.42, 0.14);
  s.bezierCurveTo(-0.42, 0.34, -0.2, 0.42, 0, 0.25);
  s.bezierCurveTo(0.2, 0.42, 0.42, 0.34, 0.42, 0.14);
  s.bezierCurveTo(0.42, -0.05, 0.05, -0.25, 0, -0.35);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.08, bevelSize: 0.06, bevelSegments: 3, curveSegments: 32 });
  geo.center();
  const h = new THREE.Group();
  const frame = new THREE.Mesh(geo, rose);
  frame.scale.set(1.12, 1.12, 0.5);
  h.add(frame, new THREE.Mesh(geo, gemMat("#ff8fa8")));
  h.rotation.x = -Math.PI / 2;
  h.position.set(0, 0.14, 0.45 + 0.45);
  const g = new THREE.Group();
  const c = necklaceCurve();
  g.add(chain(c, rose, 0.075, 0.012), h);
  g.userData.focus = h.position.clone();
  return shadows(g);
})();
P.studs = (() => {
  const g = new THREE.Group();
  [-0.55, 0.55].forEach((x) => {
    const s = brilliant(0.75, gemMat("#d8344f"));
    s.position.set(x, 0.42, 0);
    const st = setting(rose, 0.25, 0.34, 0.3);
    st.position.x = x;
    g.add(s, st);
  });
  return shadows(g);
})();
P.chains = (() => {
  const g = new THREE.Group();
  const loop = (rx, rz) => {
    const pts = [];
    for (let i = 0; i < 64; i++) { const a = (i / 64) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * rx, 0.05, Math.sin(a) * rz)); }
    return new THREE.CatmullRomCurve3(pts, true);
  };
  g.add(chain(loop(1.5, 1.05), gold, 0.16, 0.03));
  const thin = chain(loop(1.2, 0.8), gold, 0.09, 0.016);
  thin.position.set(0.25, 0, 0.2);
  g.add(thin);
  return shadows(g);
})();
Object.values(P).forEach((o) => { o.visible = false; scene.add(o); });

// ---------- 도우미 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const inOut = (t, a, b, f = 0.5) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);
function text(id, t, a, b, rise = 16) {
  const o = inOut(t, a, b, 0.7);
  $(id).style.opacity = o;
  $(id).style.transform = `translateY(${(1 - ramp(t, a, a + 0.9)) * rise}px)`;
}
function orbit(target, radius, height, angle) {
  camera.position.set(target.x + Math.sin(angle) * radius, target.y + height, target.z + Math.cos(angle) * radius);
  camera.lookAt(target);
}
const glintBox = $("glints");
function glint(i, pos3, strength, size = 1) {
  let g = glintBox.children[i];
  if (!g) { g = document.createElement("div"); g.className = "glint"; glintBox.appendChild(g); }
  camera.updateMatrixWorld();
  const v = pos3.clone().project(camera);
  g.style.left = ((v.x + 1) / 2) * W + "px";
  g.style.top = ((1 - v.y) / 2) * H + "px";
  g.style.opacity = strength;
  g.style.transform = `scale(${size * (0.6 + strength * 0.8)}) rotate(${strength * 40}deg)`;
}
const pulse = (t, at, len = 0.7) => Math.max(0, Math.sin(Math.PI * clamp((t - at) / len)));

// 장면 경계 (초)
const CUTS = [0, 4.5, 8.5, 12.5, 16.5, 20];

window.renderAt = function (t) {
  Object.values(P).forEach((o) => (o.visible = false));
  ["t1", "t2", "t3", "t4", "t5", "t6", "t7", "ln"].forEach((id) => ($(id).style.opacity = 0));
  for (const g of glintBox.children) g.style.opacity = 0;
  floor.visible = true;
  let exposure = 1.2;

  // 장면 사이 검정 페이드
  let fade = 0;
  for (const c of CUTS.slice(1, -1)) fade = Math.max(fade, 1 - clamp(Math.abs(t - c) / 0.28));
  fade = Math.max(fade, 1 - ramp(t, 0, 1.2), ramp(t, 19.3, 20));

  if (t < 4.5) {
    // 1. 어둠 속 반지 등장 + 빛이 훑고 지나감
    P.ring.visible = true;
    P.ring.rotation.set(-0.05, 0.9 + t * 0.12, 0);
    P.ring.updateMatrixWorld(true);
    orbit(new THREE.Vector3(-1.9, 1.5, 0), lerp(9.8, 8.6, t / 4.5), 1.9, 0.12);
    key.position.set(lerp(-5, 5, ramp(t, 0.3, 4.2)), 5, 3);
    key.target.position.set(0, 1, 0);
    rim.position.set(-2, 3, -3);
    exposure = lerp(0.3, 1.25, ramp(t, 0, 2.5));
    text("t1", t, 1.0, 4.4);
    text("t2", t, 2.2, 4.4);
    glint(0, P.ring.localToWorld(new THREE.Vector3(0.12, 1.7, 0.1)), pulse(t, 2.4, 0.9), 1.3);
  } else if (t < 8.5) {
    // 2. 다이아몬드 접사
    const u = t - 4.5;
    P.ring.visible = true;
    P.ring.rotation.set(-0.05, 1.4 + u * 0.18, 0);
    P.ring.updateMatrixWorld(true);
    const gemPos = P.ring.localToWorld(new THREE.Vector3(0, 1.45, 0));
    orbit(gemPos.clone().add(new THREE.Vector3(0, -0.02, 0)), lerp(3.2, 2.6, u / 4), 0.35, -0.4 + u * 0.12);
    key.position.set(2, 5, 3);
    key.target.position.copy(gemPos);
    rim.position.set(-1.5, 3.5, -2);
    text("t3", t, 5.2, 8.4, 10);
    glint(0, gemPos.clone().add(new THREE.Vector3(0.12, 0.12, 0.1)), pulse(u, 0.9, 0.8), 1.4);
    glint(1, gemPos.clone().add(new THREE.Vector3(-0.15, 0.02, 0.1)), pulse(u, 2.1, 0.7), 1.0);
    glint(2, gemPos.clone().add(new THREE.Vector3(0.05, -0.1, 0.2)), pulse(u, 3.1, 0.7), 1.2);
  } else if (t < 12.5) {
    // 3. 진주 목걸이 위로 카메라가 내려옴
    const u = t - 8.5;
    P.pearl.visible = true;
    const f = P.pearl.userData.focus;
    const tgt = new THREE.Vector3(lerp(0, f.x, u / 4), 0.1, lerp(-0.2, f.z, u / 4));
    camera.position.set(lerp(-1.2, 0.6, u / 4), lerp(6.2, 2.4, ease(u / 4)), lerp(3.6, f.z + 2.8, ease(u / 4)));
    camera.lookAt(tgt);
    key.position.set(2.5, 6, 2);
    key.target.position.set(0, 0, 0);
    rim.position.set(-3, 2, 3);
    text("t4", t, 9.1, 12.4);
    glint(0, f.clone().add(new THREE.Vector3(-0.1, 0.18, 0.05)), pulse(u, 2.6, 0.9), 1.1);
  } else if (t < 16.5) {
    // 4. 빠른 컷: 하트 목걸이 / 루비 귀걸이 / 체인 팔찌
    const u = t - 12.5, k = Math.min(2, Math.floor(u / 1.333)), v = u - k * 1.333;
    for (const c of [13.833, 15.167]) fade = Math.max(fade, 1 - clamp(Math.abs(t - c) / 0.14));
    if (k === 0) {
      P.heart.visible = true;
      const f = P.heart.userData.focus;
      orbit(f, lerp(2.6, 2.2, v / 1.33), 1.6, lerp(-0.5, -0.2, v / 1.33));
      glint(0, f.clone().add(new THREE.Vector3(0.12, 0.15, 0)), pulse(v, 0.4, 0.7), 1.1);
    } else if (k === 1) {
      P.studs.visible = true;
      orbit(new THREE.Vector3(0, 0.35, 0), lerp(3.6, 3.1, v / 1.33), 1.4, lerp(0.4, 0.1, v / 1.33));
      glint(0, new THREE.Vector3(0.55, 0.55, 0.05), pulse(v, 0.4, 0.7), 1.1);
      glint(1, new THREE.Vector3(-0.55, 0.55, 0.05), pulse(v, 0.7, 0.6), 0.9);
    } else {
      P.chains.visible = true;
      P.chains.rotation.y = v * 0.35;
      orbit(new THREE.Vector3(0.1, 0, 0.1), 5.2, 3.6, lerp(0.2, -0.1, v / 1.33));
    }
    key.position.set(2.5, 6, 2.5);
    key.target.position.set(0, 0, 0);
    rim.position.set(-3, 2.5, -2);
    text("t5", t, 12.9, 16.4, 8);
  } else {
    // 5. 로고 엔딩
    const u = t - 16.5;
    P.ring.visible = true;
    P.ring.rotation.set(-0.05, 2.2 + u * 0.35, 0);
    P.ring.updateMatrixWorld(true);
    camera.position.set(0, 2.6, 15);
    camera.lookAt(0, 0.1, 0);
    key.position.set(0, 6, 3);
    key.target.position.set(0, 1, 0);
    rim.position.set(0, 3, -3);
    exposure = 1.1;
    const o = inOut(t, 16.8, 20.2, 0.8);
    $("t6").style.opacity = o;
    $("t6").style.transform = `scale(${lerp(1.06, 1, ramp(t, 16.8, 18.5))})`;
    $("ln").style.opacity = ramp(t, 17.4, 18.2) * (1 - ramp(t, 19.3, 20));
    $("ln").style.width = lerp(0, 420, ramp(t, 17.4, 18.4)) + "px";
    text("t7", t, 17.8, 20.2, 8);
    glint(0, P.ring.localToWorld(new THREE.Vector3(0.1, 1.7, 0.1)), pulse(u, 1.2, 0.9), 1.2);
  }

  renderer.toneMappingExposure = exposure;
  $("fade").style.opacity = fade;
  renderer.render(scene, camera);
};
await document.fonts.ready;
window.renderAt(0);
window.__ready = true;
</script>
</body></html>
