<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-kr/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/cormorant-garamond/600.css">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; object-fit: cover; opacity: 0; will-change: transform; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 50%, rgba(0,0,0,.55) 100%); }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; pointer-events: none; opacity: 0;
    background: linear-gradient(transparent, rgba(12,8,4,.72)); }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; }
  .txt { position: absolute; color: #fbf6ee; opacity: 0; font-family: "Noto Serif KR", serif; font-weight: 600;
    text-shadow: 0 2px 24px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.5); }
  .big { font-size: 56px; left: 90px; }
  .mid { font-size: 38px; left: 0; right: 0; text-align: center; }
  .kick { left: 0; right: 0; text-align: center; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 26px; letter-spacing: 0.5em; color: #f0d59a; }
  .logo { left: 0; right: 0; text-align: center; font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 96px; letter-spacing: 0.06em;
    background: linear-gradient(135deg, #f7e3b0, #d4b06a 45%, #b08a44); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .small { left: 0; right: 0; text-align: center; font-weight: 400; font-size: 26px; color: #e6dccd; }
  .line { position: absolute; left: 50%; height: 1px; background: linear-gradient(90deg, transparent, #d4b06a, transparent); transform: translateX(-50%); opacity: 0; }
  .mark { position: absolute; right: 22px; bottom: 16px; font: 400 15px "Noto Serif KR", serif; color: rgba(251,246,238,.55); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .glint { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; opacity: 0; mix-blend-mode: screen;
    background:
      radial-gradient(circle, rgba(255,255,255,1) 0 3%, rgba(255,240,210,.55) 7%, transparent 20%),
      linear-gradient(90deg, transparent 0 46.5%, rgba(255,255,255,.95) 50%, transparent 53.5% 100%),
      linear-gradient(0deg, transparent 0 47.5%, rgba(255,255,255,.9) 50%, transparent 52.5% 100%);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 70%); mask: radial-gradient(circle, #000 18%, transparent 70%); }
</style>
</head><body>
<div id="stage">
  <img class="shot" id="s3" src="ai/3-woman.png">
  <img class="shot" id="s7" src="ai/7-front.png">
  <img class="shot" id="s5" src="ai/5-side.png">
  <img class="shot" id="s6" src="ai/6-top.png">
  <img class="shot" id="s4" src="ai/4-table.png">
  <img class="shot" id="s2" src="ai/2-collage4.png">
  <div class="vignette"></div>
  <div class="shade" id="shade"></div>
  <div class="txt big" id="t1" style="top:470px">당신의 하루에</div>
  <div class="txt big" id="t2" style="top:550px">작은 빛 하나</div>
  <div class="txt kick" id="t3" style="top:58px">HANDPICKED JEWELRY</div>
  <div class="txt big" id="t4" style="top:585px; font-size:44px">매일 착용해도 편안한</div>
  <div class="txt mid" id="t5" style="top:610px">프러포즈 · 기념일 · 선물</div>
  <div class="txt logo" id="t6" style="top:250px">Finest Jewelry</div>
  <div class="line" id="ln" style="top:392px; width:440px"></div>
  <div class="txt small" id="t7" style="top:415px">네이버 스마트스토어에서 만나보세요</div>
  <div id="glints"></div>
  <div class="fade" id="fade"></div>
  <div class="mark">시안용 가상 광고</div>
</div>
<script>
const W = 1280, H = 720, K = W / 1672; // 사진 좌표(1672×941) → 화면 좌표
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const inOut = (t, a, b, f = 0.6) => Math.min(ramp(t, a, a + f), 1 - ramp(t, b - f, b));
const lerp = (a, b, x) => a + (b - a) * x;
const $ = (id) => document.getElementById(id);

// [시작, 끝, 사진, 초점(사진 좌표), 시작 배율, 끝 배율, 밝기]
const SHOTS = [
  [0, 4.5, "s3", [1085, 540], 1.0, 1.12, 1],
  [4.5, 8.5, "s7", [840, 470], 1.04, 1.24, 1],
  [8.5, 12.5, "s5", [1090, 560], 1.14, 1.0, 1],
  [12.5, 13.833, "s6", [850, 430], 1.0, 1.14, 1],
  [13.833, 15.167, "s4", [760, 470], 1.14, 1.02, 1],
  [15.167, 16.5, "s2", [836, 470], 1.0, 1.06, 1],
  [16.5, 20.2, "s4", [760, 470], 1.1, 1.18, 0.33],
];
// 반짝임: [시각, 사진, 사진 좌표, 크기]
const GLINTS = [
  [2.85, "s3", [1098, 530], 1.2],
  [5.8, "s7", [795, 405], 1.4], [6.95, "s7", [930, 575], 1.0], [7.95, "s7", [860, 285], 1.2],
  [11.55, "s5", [1100, 540], 1.1],
  [13.25, "s6", [925, 300], 1.1],
  [14.58, "s4", [705, 420], 1.2], [14.83, "s4", [1200, 505], 0.9],
  [18.15, "s4", [760, 440], 1.3],
];
const CUTS = [4.5, 8.5, 12.5, 16.5];
const FAST = [13.833, 15.167];

function shotState(t, id) {
  for (const [a, b, sid, f, s0, s1, br] of SHOTS) {
    if (sid === id && t >= a && t < b) {
      const s = lerp(s0, s1, ease((t - a) / (b - a)));
      return { s, fx: f[0] * K, fy: f[1] * K, br };
    }
  }
  return null;
}
const glintBox = $("glints");

window.renderAt = function (t) {
  document.querySelectorAll(".shot").forEach((n) => (n.style.opacity = 0));
  let active = null;
  for (const [a, b, sid] of SHOTS) if (t >= a && t < b) active = sid;
  const st = shotState(t, active);
  const img = $(active);
  img.style.opacity = 1;
  img.style.transformOrigin = `${st.fx}px ${st.fy}px`;
  img.style.transform = `scale(${st.s})`;
  img.style.filter = st.br < 1 ? `brightness(${st.br}) blur(2px) saturate(1.1)` : "saturate(1.05)";

  // 글자
  ["t1", "t2", "t3", "t4", "t5", "t6", "t7", "ln"].forEach((id) => ($(id).style.opacity = 0));
  const text = (id, a, b, rise = 14) => {
    $(id).style.opacity = inOut(t, a, b, 0.7);
    $(id).style.transform = `translateY(${(1 - ramp(t, a, a + 0.9)) * rise}px)`;
  };
  text("t1", 1.0, 4.4); text("t2", 2.1, 4.4);
  text("t3", 5.0, 8.4, 8);
  text("t4", 9.1, 12.4);
  text("t5", 12.8, 16.4, 8);
  const lo = inOut(t, 16.8, 20.3, 0.8);
  $("t6").style.opacity = lo;
  $("t6").style.transform = `scale(${lerp(1.06, 1, ramp(t, 16.8, 18.5))})`;
  $("ln").style.opacity = ramp(t, 17.4, 18.2) * (1 - ramp(t, 19.3, 20));
  $("ln").style.width = lerp(0, 440, ramp(t, 17.4, 18.4)) + "px";
  text("t7", 17.8, 20.3, 8);
  $("shade").style.opacity = t < 16.5 ? 1 : 0;

  // 반짝임
  GLINTS.forEach(([at, sid, p, size], i) => {
    let g = glintBox.children[i];
    if (!g) { g = document.createElement("div"); g.className = "glint"; glintBox.appendChild(g); }
    const k = Math.max(0, Math.sin(Math.PI * clamp((t - at + 0.4) / 0.8)));
    if (sid !== active || k <= 0) { g.style.opacity = 0; return; }
    const x = st.fx + (p[0] * K - st.fx) * st.s, y = st.fy + (p[1] * K - st.fy) * st.s;
    g.style.left = x + "px"; g.style.top = y + "px";
    g.style.opacity = k * (sid === "s4" && t > 16.5 ? 0.8 : 1);
    g.style.transform = `scale(${size * (0.5 + k * 0.8)}) rotate(${k * 45}deg)`;
  });

  // 검정 페이드
  let fade = Math.max(1 - ramp(t, 0, 1.0), ramp(t, 19.3, 20));
  for (const c of CUTS) fade = Math.max(fade, 1 - clamp(Math.abs(t - c) / 0.3));
  for (const c of FAST) fade = Math.max(fade, 0.85 * (1 - clamp(Math.abs(t - c) / 0.12)));
  $("fade").style.opacity = fade;
};
Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode())]).then(() => {
  window.renderAt(0);
  window.__ready = true;
});
</script>
</body></html>
